<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Accent Neon Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f111a" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow -->
  <path d="M256 32 C340 32 432 64 432 144 C432 296 352 416 256 480 C160 416 80 296 80 144 C80 64 172 32 256 32 Z"
        fill="url(#borderGrad)" filter="url(#softShadow)" />

  <!-- Inner Dark Shield -->
  <path d="M256 46 C332 46 416 76 416 150 C416 288 342 398 256 458 C170 398 96 288 96 150 C96 76 180 46 256 46 Z"
        fill="url(#bgGrad)" />

  <!-- Radial Core Glow Behind Ball -->
  <circle cx="256" cy="240" r="150" fill="url(#coreGlow)" />

  <!-- Tactical Pitch Radar Grid Rings -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#2a3048" stroke-width="2" stroke-dasharray="4,6" opacity="0.6"/>
  <circle cx="256" cy="240" r="95" fill="none" stroke="#3b4263" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="240" r="45" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>

  <!-- Tactical Crosshairs -->
  <line x1="256" y1="90" x2="256" y2="390" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,8" opacity="0.45"/>
  <line x1="110" y1="240" x2="402" y2="240" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,8" opacity="0.45"/>

  <!-- Scouting Progression Growth Curve (Rising Arrow) -->
  <path d="M140 330 Q 220 310 260 230 T 375 145" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)"/>
  <polygon points="385,135 360,140 372,160" fill="#10b981"/>

  <!-- Football Elements -->
  <!-- Outer Ball Circle -->
  <circle cx="256" cy="240" r="82" fill="#131622" stroke="url(#borderGrad)" stroke-width="5"/>

  <!-- Central Pentagon -->
  <polygon points="256,204 286,226 274,260 238,260 226,226" fill="#7c3aed"/>

  <!-- Pentagon Outer Seams & Adjacent Panels -->
  <!-- Top line to edge -->
  <line x1="256" y1="204" x2="256" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Top-right seam -->
  <line x1="286" y1="226" x2="326" y2="208" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom-right seam -->
  <line x1="274" y1="260" x2="304" y2="300" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom-left seam -->
  <line x1="238" y1="260" x2="208" y2="300" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <!-- Top-left seam -->
  <line x1="226" y1="226" x2="186" y2="208" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>

  <!-- Perimeter Panels -->
  <polygon points="256,160 230,174 200,165 210,158" fill="#1e2337"/>
  <polygon points="326,208 335,238 337,250 330,225" fill="#1e2337"/>
  <polygon points="186,208 177,238 175,250 182,225" fill="#1e2337"/>

  <!-- Wonderkid Star Badge on Top Right -->
  <g transform="translate(355, 105)">
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3"/>
    <path d="M0 -16 L4.5 -4.5 L17 -3 L7.5 5.5 L10.5 17 L0 10.5 L-10.5 17 L-7.5 5.5 L-17 -3 L-4.5 -4.5 Z" fill="#fbbf24"/>
  </g>

  <!-- Banner at Bottom: FM27 -->
  <g transform="translate(256, 405)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#181c2e" stroke="url(#borderGrad)" stroke-width="2.5"/>
    <text x="0" y="8" font-family="'Inter', 'Kanit', sans-serif" font-weight="900" font-size="22" letter-spacing="3" fill="#ffffff" text-anchor="middle">FM27</text>
  </g>
</svg>